<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedido confirmado - Loja Shalom</title>
    <style>
        *{box-sizing:border-box}body{margin:0;min-height:100vh;padding:25px;font-family:Arial,sans-serif;background:#eef3f9;color:#172033}
        .card{max-width:720px;margin:30px auto;background:#fff;padding:32px;border-radius:16px;box-shadow:0 5px 20px rgba(0,0,0,.08)}
        h1{color:#16813d}h2{color:#0d47a1}.item{padding:10px 0;border-bottom:1px solid #eee;display:flex;justify-content:space-between;gap:10px}
        .total{margin-top:20px;font-size:22px;font-weight:700}.acoes{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
        a{display:inline-block;padding:12px 18px;border-radius:8px;background:#1976d2;color:#fff;text-decoration:none;font-weight:700}
        a.sec{background:#eef3f9;color:#1976d2}
        .erro{color:#c62828}
    </style>
</head>
<body>
<main class="card" id="resultado"></main>
<script>
document.addEventListener("DOMContentLoaded", () => {
    const area = document.getElementById("resultado");
    let pedido = null;
    try { pedido = JSON.parse(localStorage.getItem("pedidoTemporario") || "null"); } catch {}

    if (!pedido) {
        area.innerHTML = '<h1 class="erro">Nenhum pedido encontrado.</h1><p>Volte para a loja e faça uma nova compra.</p><div class="acoes"><a href="comprar.html">Voltar para a loja</a></div>';
        return;
    }

    const dinheiro = v => Number(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
    const itens = Array.isArray(pedido.produtos) ? pedido.produtos.map(item => `
        <div class="item"><span>${escapeHTML(item.nome)} x${Number(item.quantidade)||0}</span><strong>${dinheiro((Number(item.preco)||0)*(Number(item.quantidade)||0))}</strong></div>
    `).join("") : "";

    area.innerHTML = `
        <h1>✅ Pedido realizado!</h1>
        <p>Seu pedido foi registrado com sucesso.</p>
        <p><strong>Cliente:</strong> ${escapeHTML(pedido.nome)}</p>
        <p><strong>Pagamento:</strong> ${escapeHTML(pedido.pagamento)}</p>
        <p><strong>Endereço:</strong> ${escapeHTML(pedido.endereco)}, ${escapeHTML(pedido.numero)} - ${escapeHTML(pedido.cidade)}</p>
        <h2>Itens</h2>
        ${itens || "<p>Nenhum item.</p>"}
        <div class="total">Total: ${dinheiro(pedido.total)}</div>
        <div class="acoes">
            <a href="comprar.html">Continuar comprando</a>
            <a href="index.html" class="sec">Página inicial</a>
        </div>
    `;

    function escapeHTML(v) {
        return String(v ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
    }
});
</script>
</body>
</html>
