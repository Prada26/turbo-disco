<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - Loja Shalom</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
<main class="login-container">
    <section class="login-card">
        <div class="logo">📦</div>
        <h1>Loja Shalom</h1>
        <p class="subtitulo">Entre na sua conta</p>

        <form id="loginForm">
            <label for="email">E-mail</label>
            <input type="email" id="email" autocomplete="email" placeholder="Digite seu e-mail" required>

            <label for="senha">Senha</label>
            <input type="password" id="senha" autocomplete="current-password" placeholder="Digite sua senha" required>

            <div id="mensagem" class="mensagem" aria-live="polite"></div>
            <button type="submit">🔐 Entrar</button>
        </form>

        <p class="cadastro">Ainda não possui conta? <a href="cadastro.html">Criar cadastro</a></p>
        <a href="index.html" class="voltar">← Voltar para a loja</a>
    </section>
</main>
<script src="login.js"></script>
<body>
