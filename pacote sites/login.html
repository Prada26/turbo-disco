```html
<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

<main class="login-pagina">

    <div class="login-caixa">

        <h1>Entrar</h1>

        <p>
            Acesse sua conta.
        </p>


        <form id="loginForm">

            <input
                type="email"
                id="email"
                placeholder="E-mail"
                required
            >

            <input
                type="password"
                id="senha"
                placeholder="Senha"
                required
            >

            <button
                type="submit"
                class="btn-principal"
            >
                Entrar
            </button>

        </form>


        <p
            id="mensagem"
            class="mensagem"
        ></p>


        <a href="index.html">
            ← Voltar para o site
        </a>

    </div>

</main>


<script src="login.js"></script>

</body>

</html>
```
